[project]
name = "telephone-doodle-backend"
version = "0.1.0"
description = "Telephone Doodle API: rooms, realtime gameplay and persistence."
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
# target-version is deliberately omitted: ruff infers it from requires-python
# above, so there is only one place to bump the Python version.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

# Package layering (BUILD_PLAN.md section 2): api calls rooms; rooms calls
# game_engine and storage; game_engine calls nobody. import-linter checks the
# real import graph, so it catches indirect chains (api -> rooms -> api) that a
# per-file check cannot.
#
# Only packages that exist can be listed as roots, and layers in parentheses are
# tolerated while they are missing, so this contract is written for the finished
# architecture and starts enforcing each layer in the step that creates it.
# tests/game_engine/test_package_boundaries.py fails if a package on disk is
# missing from root_packages, so the two cannot drift apart.
[tool.importlinter]
root_packages = ["api", "game_engine", "rooms", "storage"]

[[tool.importlinter.contracts]]
name = "Packages are layered, top to bottom"
type = "layers"
layers = [
    "api",
    "rooms",
    # Siblings on one layer, separated by `:`, are independent: `game_engine`
    # and `storage` may not import each other in either direction. `rooms`
    # sits above both and translates, which is what keeps the rules free of
    # SQL and the SQL free of the rules.
    "game_engine : storage",
]

[tool.pytest.ini_options]
# The backend has no src/ layout: packages sit directly in backend/, so tests
# import them as plain top-level names (`from main import app`).
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings are errors: deprecations from FastAPI, Starlette or psycopg should
# fail CI while they are cheap to fix, not pile up silently.
addopts = "-q --strict-markers --strict-config -W error"
