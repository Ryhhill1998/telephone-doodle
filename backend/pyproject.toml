[project]
name = "telephone-doodle-backend"
version = "0.1.0"
description = "Telephone Doodle API: rooms, realtime gameplay and persistence."
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
# target-version is deliberately omitted: ruff infers it from requires-python
# above, so there is only one place to bump the Python version.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
# The backend has no src/ layout: packages sit directly in backend/, so tests
# import them as plain top-level names (`from main import app`).
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings are errors: deprecations from FastAPI, Starlette or psycopg should
# fail CI while they are cheap to fix, not pile up silently.
addopts = "-q --strict-markers --strict-config -W error"
